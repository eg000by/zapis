name: pulse

# Частый «пульс» (вопрос «как прошло занятие?» сразу после его конца): бесплатный
# Vercel даёт кроны только раз в день, поэтому дёргает GitHub Actions.
#
# ЭТО ПОДСТРАХОВКА, а не основной планировщик. Основной — внешний пингер
# (cron-job.org, каждые 5 минут, тот же адрес с заголовком Authorization: Bearer
# <CRON_SECRET>). Так сделано потому, что GitHub не гарантирует расписание и особенно
# жёстко душит кроны ПУБЛИЧНЫХ репозиториев: при `*/15` реальные запуски приходили раз
# в 2–3 часа, и занятия оставались без уведомления (30 июля — занятие в 10:10).
#
# Поэтому запуск не «пингует и уходит», а сам держит частоту: бьёт в эндпоинт каждые
# 5 минут в течение ~50 минут, а следующий запуск отменяет предыдущий (concurrency
# ниже). Если внешний пингер умрёт, этот workflow хотя бы закроет часть простоя.
#
# Секрет репозитория: CRON_SECRET — то же значение, что в переменных окружения Vercel.
# Без него эндпоинт отвечает 503, и job падает намеренно (см. lib/cron-auth.ts).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Свежий запуск важнее уже идущего: он отменяет старый цикл и начинает свой.
concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Пульс каждые 5 минут в течение ~50 минут
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: https://zapis-ten.vercel.app/api/cron/pulse
        run: |
          set -u
          # Пробелы и перевод строки в конце секрета (частый гость при копировании
          # через буфер обмена) делают заголовок невалидным — срезаем.
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          fails=0
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/pulse.out -w '%{http_code}' -m 60 \
              -H "Authorization: Bearer $CRON_SECRET" "$URL") || code=000
            echo "$(date -u +%H:%M:%SZ) HTTP $code $(head -c 200 /tmp/pulse.out)"
            if [ "$code" != "200" ]; then
              fails=$((fails + 1))
            fi
            if [ "$i" -lt 10 ]; then
              sleep 300
            fi
          done
          # Разовый сбой (деплой, холодный старт) — не повод шуметь, системный — повод.
          if [ "$fails" -ge 3 ]; then
            echo "::error::Пульс не отвечает: $fails неудачных попыток из 10"
            exit 1
          fi
